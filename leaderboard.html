<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Leaderboard - Alpha Z</title>
    <style>
        :root { --bg-color: #2c3e50; --panel-bg: #1e1e1e; --accent: #f1c40f; --text-color: #ecf0f1; }
        
        /* [1] 화면 전체 레이아웃 잡기 */
        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* 중요: 화면 세로 꽉 채우기 및 플렉스 설정 */
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden; /* 전체 스크롤 방지 */
        }

        h1 { margin: 20px 0 10px 0; font-size: 1.8rem; color: var(--accent); text-shadow: 2px 2px 4px rgba(0,0,0,0.5); flex-shrink: 0; }

        /* 탭 메뉴 (고정) */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            flex-shrink: 0;
            z-index: 10;
        }
        .tab-btn {
            background: #34495e; color: #bbb; border: none; padding: 10px 20px; border-radius: 20px;
            font-weight: bold; cursor: pointer; transition: all 0.2s;
        }
        .tab-btn.active { background: var(--accent); color: #2c3e50; transform: scale(1.05); }

        /* [2] 리더보드 리스트 (스크롤 영역) */
        #leaderboard-container {
            width: 95%;
            max-width: 500px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            padding: 10px;
            box-sizing: border-box;
            
            /* 중요: 남은 높이 모두 차지하고 내부 스크롤 */
            flex: 1;
            overflow-y: auto;
            margin-bottom: 10px; /* 버튼과 간격 */
            
            /* 스크롤바 디자인 */
            scrollbar-width: thin;
            scrollbar-color: var(--accent) #2c3e50;
        }

        /* 리스트 아이템 스타일 */
        .rank-item {
            display: flex;
            align-items: center;
            background: #34495e;
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            transition: transform 0.1s;
        }
        .rank-item:active { transform: scale(0.98); }
        
        .rank-num { font-size: 1.2rem; font-weight: bold; width: 40px; text-align: center; color: #aaa; }
        .rank-1 .rank-num { color: #ffd700; text-shadow: 0 0 10px gold; font-size: 1.5rem; }
        .rank-2 .rank-num { color: #c0c0c0; text-shadow: 0 0 5px silver; }
        .rank-3 .rank-num { color: #cd7f32; }

        .rank-info { flex: 1; display: flex; flex-direction: column; padding-left: 10px; }
        .user-name { font-weight: bold; font-size: 1rem; color: #fff; }
        .user-score { font-size: 0.9rem; color: var(--accent); }
        .rank-char { font-size: 1.5rem; font-weight: 800; width: 40px; text-align: center; color: #fff; background: rgba(255,255,255,0.1); padding: 5px; border-radius: 5px; }

        /* [3] 하단 버튼 영역 (바닥 고정) */
        .footer-btn-container {
            width: 100%;
            max-width: 500px;
            padding: 0 20px 20px 20px; /* 아래 여백 */
            box-sizing: border-box;
            flex-shrink: 0; /* 크기 고정 */
        }

        .btn-home {
            width: 100%;
            padding: 15px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 0 #c0392b;
            display: flex; justify-content: center; align-items: center; gap: 8px;
        }
        .btn-home:active { transform: translateY(4px); box-shadow: none; }

        /* 로딩 스피너 */
        .loading { text-align: center; color: #aaa; margin-top: 20px; }

    </style>
</head>
<body>

    <h1>🏆 RANKING</h1>

    <div class="tabs">
        <button class="tab-btn active" onclick="filterRank('NORMAL')">NORMAL</button>
        <button class="tab-btn" onclick="filterRank('HARD')">HARD</button>
        <button class="tab-btn" onclick="filterRank('HELL')">HELL</button>
        <button class="tab-btn" onclick="filterRank('EASY')">EASY</button>
    </div>

    <div id="leaderboard-container">
        <div id="rank-list" class="loading">Loading...</div>
    </div>

    <div class="footer-btn-container">
        <button class="btn-home" onclick="location.href='index.html'">
            🏠 MAIN MENU
        </button>
    </div>

    <script type="module">
        // ... (기존 leaderboard.js 로직) ...
        // 단, 기존에 데이터를 뿌려주는 타겟 ID가 'rank-list'여야 합니다.
    </script>
</body>
</html>
