<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Leaderboard - Alpha Z</title>
    <style>
        :root { --bg-color: #2c3e50; --panel-bg: #1e1e1e; --accent: #f1c40f; --text-color: #ecf0f1; }
        
        body {
            margin: 0; padding: 0;
            background-color: var(--bg-color); color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh; display: flex; flex-direction: column; align-items: center; overflow: hidden;
        }

        h1 { margin: 20px 0 15px 0; font-size: 1.8rem; color: var(--accent); text-shadow: 2px 2px 4px rgba(0,0,0,0.5); flex-shrink: 0; }

        /* 탭 메뉴 (순서 수정됨) */
        .tabs { display: flex; gap: 8px; margin-bottom: 15px; flex-shrink: 0; z-index: 10; }
        .tab-btn {
            background: #34495e; color: #bbb; border: none; padding: 8px 16px; border-radius: 20px;
            font-weight: bold; cursor: pointer; transition: all 0.2s; font-size: 0.9rem;
        }
        .tab-btn.active { background: var(--accent); color: #2c3e50; transform: scale(1.05); box-shadow: 0 0 10px rgba(241, 196, 15, 0.4); }

        /* 리스트 영역 */
        #leaderboard-container {
            width: 95%; max-width: 500px;
            background: rgba(0, 0, 0, 0.3); border-radius: 15px; padding: 10px; box-sizing: border-box;
            flex: 1; overflow-y: auto; margin-bottom: 10px;
            scrollbar-width: thin; scrollbar-color: var(--accent) #2c3e50;
        }

        /* 랭킹 아이템 */
        .rank-item {
            display: flex; align-items: center; background: #34495e; padding: 12px; margin-bottom: 8px;
            border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .rank-num { font-size: 1.2rem; font-weight: bold; width: 40px; text-align: center; color: #aaa; }
        .rank-1 .rank-num { color: #ffd700; text-shadow: 0 0 10px gold; font-size: 1.5rem; }
        .rank-2 .rank-num { color: #c0c0c0; text-shadow: 0 0 5px silver; }
        .rank-3 .rank-num { color: #cd7f32; }

        .rank-info { flex: 1; display: flex; flex-direction: column; padding-left: 10px; }
        .user-name { font-weight: bold; font-size: 1rem; color: #fff; }
        .user-score { font-size: 0.9rem; color: var(--accent); margin-top: 2px;}
        .rank-char { font-size: 1.4rem; font-weight: 800; width: 35px; text-align: center; color: #fff; background: rgba(255,255,255,0.1); padding: 5px; border-radius: 5px; margin-left: 10px;}

        /* 하단 버튼 */
        .footer-btn-container { width: 100%; max-width: 500px; padding: 0 20px 20px 20px; box-sizing: border-box; flex-shrink: 0; }
        .btn-home {
            width: 100%; padding: 15px; background: #e74c3c; color: white; border: none; border-radius: 12px;
            font-size: 1.1rem; font-weight: bold; cursor: pointer; box-shadow: 0 4px 0 #c0392b;
            display: flex; justify-content: center; align-items: center; gap: 8px; text-decoration: none;
        }
        .btn-home:active { transform: translateY(4px); box-shadow: none; }
        .loading { text-align: center; color: #aaa; margin-top: 50px; font-size: 1.2rem; }
    </style>
</head>
<body>

    <h1>🏆 RANKING</h1>

    <div class="tabs">
        <button class="tab-btn" onclick="filterRank('EASY')" id="btn-EASY">EASY</button>
        <button class="tab-btn active" onclick="filterRank('NORMAL')" id="btn-NORMAL">NORMAL</button>
        <button class="tab-btn" onclick="filterRank('HARD')" id="btn-HARD">HARD</button>
        <button class="tab-btn" onclick="filterRank('HELL')" id="btn-HELL">HELL</button>
    </div>

    <div id="leaderboard-container">
        <div id="rank-list" class="loading">Loading...</div>
    </div>

    <div class="footer-btn-container">
        <a href="/" class="btn-home">🏠 MAIN MENU</a>
    </div>

    <script type="module">
        import { db } from "./js/firebase-config.js";
        // [버전 확인 완료] 10.8.0
        import { collection, query, where, orderBy, limit, getDocs } 
        from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const listContainer = document.getElementById('rank-list');
        let currentDiff = 'NORMAL';

        // [핵심] 랭킹 불러오기 함수
        async function loadLeaderboard(difficulty) {
            currentDiff = difficulty;
            listContainer.innerHTML = '<div class="loading">Loading...</div>';

            // 버튼 스타일 업데이트
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.getElementById(`btn-${difficulty}`);
            if(activeBtn) activeBtn.classList.add('active');

            try {
                // 1. 쿼리 생성 (점수 내림차순 정렬)
                // Firestore 색인이 필요할 수 있습니다. (console창 링크 확인 필요)
                const q = query(
                    collection(db, "leaderboard"),
                    where("difficulty", "==", difficulty),
                    orderBy("score", "desc"),
                    limit(50)
                );

                const snapshot = await getDocs(q);
                
                if (snapshot.empty) {
                    listContainer.innerHTML = '<div class="loading">No records yet.</div>';
                    return;
                }

                let html = '';
                let rank = 1;
                snapshot.forEach(doc => {
                    const data = doc.data();
                    const rankClass = rank <= 3 ? `rank-${rank}` : '';
                    
                    // 베스트 문자(bestChar)가 없으면 점수로 추정해서 보여줌
                    let displayChar = data.bestChar || '?';
                    
                    html += `
                        <div class="rank-item ${rankClass}">
                            <div class="rank-num">${rank}</div>
                            <div class="rank-info">
                                <span class="user-name">${data.username}</span>
                                <span class="user-score">${data.score.toLocaleString()} pts</span>
                            </div>
                            <div class="rank-char">${displayChar}</div>
                        </div>
                    `;
                    rank++;
                });

                listContainer.innerHTML = html;

            } catch (error) {
                console.error("Error loading leaderboard:", error);
                // 색인(Index) 오류일 경우 처리
                if (error.message.includes("index")) {
                     listContainer.innerHTML = `<div class="loading" style="font-size:0.9rem; color:#e74c3c;">
                        ⚠️ 색인 생성 필요<br>개발자 도구(F12) 콘솔의 링크를 클릭하세요.
                     </div>`;
                } else {
                    listContainer.innerHTML = '<div class="loading">Error loading data.</div>';
                }
            }
        }

        // [중요] HTML 버튼에서 onclick으로 호출할 수 있게 window에 연결
        window.filterRank = function(difficulty) {
            loadLeaderboard(difficulty);
        };

        // 초기 실행 (NORMAL 모드)
        loadLeaderboard('NORMAL');

    </script>
</body>
</html>
